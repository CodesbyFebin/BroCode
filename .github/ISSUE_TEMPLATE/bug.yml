name: Site bug
description: Broken link, layout, accessibility or build problem
labels: [bug]
body:
  - type: input
    id: url
    attributes: {label: Page URL or file}
  - type: textarea
    id: what
    attributes: {label: What happened and what you expected}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: Browser / device or Node version}
