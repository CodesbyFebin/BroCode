name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - name: Check required SEO / AI files
        run: |
          for f in index.html 404.html sitemap.xml robots.txt llms.txt llms-full.txt; do test -s "dist/$f" || { echo "missing dist/$f"; exit 1; }; done
          grep -q "Sitemap: https://codingagent.in/sitemap.xml" dist/robots.txt
          ! grep -rq "brocode.example" dist
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7
