name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site build and verify (/site)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - name: Check required SEO / AI files
        run: |
          for f in index.html 404.html sitemap.xml robots.txt llms.txt llms-full.txt; do test -s "dist/$f" || { echo "missing dist/$f"; exit 1; }; done
          grep -q "Sitemap: https://codingagent.in/sitemap.xml" dist/robots.txt
          ! grep -rq "brocode.example" dist
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

  app:
    name: App typecheck, agent tests, build (/app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci rejects the inherited lockfile (pre-existing ajv mismatch), so install matches local validation.
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:agent
      - run: npm run build

  agents-py:
    name: Python agents (/agents-py)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agents-py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -q
